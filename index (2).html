<body>
  <main class="app">
    <section id="menuScreen">
      <h1>Флаги мира</h1>
      <p>Введите никнейм, выберите регион и нажмите «Играть».</p>
      <div class="nickname"><input id="nickname" placeholder="Ваш никнейм"><button id="saveNickname">Сохранить</button></div>
      <div id="regionButtons" class="regions">
        <button data-region="europe">Европа</button><button data-region="americas">Америка</button>
        <button data-region="asia">Азия</button><button data-region="africa">Африка</button>
        <button data-region="world" class="wide">Весь мир</button>
      </div>
      <button id="playButton" class="green wide" disabled>Играть</button>
    </section>

    <section id="gameScreen" hidden>
      <div class="top"><strong id="player"></strong><button id="backButton">← В меню</button></div>
      <h1>Угадай страну</h1><p id="level"></p><p id="rule"></p>
      <p class="score">Очки: <span id="score">0</span></p>
      <section id="flagRound">
        <div class="flag"><img id="flagImage" alt="Флаг страны"></div>
        <form id="answerForm"><input id="countryInput" placeholder="Название страны" required><input id="capitalInput" placeholder="Столица" hidden><button class="green">Проверить</button></form>
      </section>
      <section id="mapRound" hidden>
        <h2 id="mapTask"></h2><p>Наведите курсор на страну и нажмите на неё.</p>
        <div id="map"></div><p id="chosenCountry">Страна не выбрана</p>
        <button id="confirmCountry" disabled>Выбрать страну</button><p>Выберите континент:</p>
        <div id="continentButtons" class="continents"></div><button id="checkMap" class="green wide" disabled>Проверить</button>
      </section>
      <p id="message"></p>
      <p class="hint">Команды разработчика: set1, set2, set3.</p>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
